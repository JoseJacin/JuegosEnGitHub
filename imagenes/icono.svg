  </defs>
  <!-- Background icon container -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#40515d" stroke-width="4"/>

  <!-- Bottle 1 (Left) -->
  <g transform="translate(85, 120)">
    <!-- Cork -->
    <rect x="15" y="0" width="70" height="24" rx="4" fill="url(#cork)" stroke="#7a492b" stroke-width="3"/>
    <!-- Glass body -->
    <rect x="0" y="22" width="100" height="240" rx="20" fill="#141f28" stroke="#a9c1ca" stroke-width="8"/>
    <!-- Liquids -->
    <path d="M 4 190 Q 50 190 96 190 L 96 242 Q 96 258 80 258 L 20 258 Q 4 258 4 242 Z" fill="#e87575"/>
    <rect x="4" y="125" width="92" height="65" fill="#efc15e"/>
