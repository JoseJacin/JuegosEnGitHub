    <linearGradient id="cork" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#744226"/>
      <stop offset="45%" stop-color="#c88b54"/>
      <stop offset="100%" stop-color="#8b5732"/>
